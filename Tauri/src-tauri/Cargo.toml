[package]
name = "forgelink-tauri-shell"
version = "2.0.3"
description = "Tauri 2 shell scaffold for ForgeLink"
authors = ["Jeremy Shows"]
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
name = "forgelink_tauri_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forgelink-tauri-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.1.4", default-features = false, features = ["v1"] }
