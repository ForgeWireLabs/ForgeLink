[package]
name = "forgelink-tauri-shell"
version = "2.0.3"
description = "Tauri 2 shell scaffold for ForgeLink"
authors = ["Jeremy Shows"]
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
name = "forgelink_tauri_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forgelink-tauri-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
url = "2"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.1.4", default-features = false, features = ["v1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
