[package]
name = "forgelink-tauri-shell"
version = "2.0.3"
description = "Tauri 2 shell scaffold for ForgeLink"
authors = ["Jeremy Shows"]
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
name = "forgelink_tauri_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forgelink-tauri-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
